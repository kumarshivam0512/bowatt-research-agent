[project]
name = "research-agent-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141",
    "uvicorn>=0.53",
    "python-multipart>=0.0.32",
    "langchain>=1.4",
    "langgraph>=1.2",
    "langchain-anthropic>=1.7",
    "langchain-openai>=1.6",
    "langchain-tavily>=0.2.18",
    "langchain-text-splitters>=1.1",
    "numpy>=2",
]

[dependency-groups]
dev = ["pytest>=9", "httpx2>=2.13"]

[tool.pytest]
pythonpath = ["."]
